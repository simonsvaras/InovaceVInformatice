services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB must be set}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL must be set}
      FIO_TOKEN_ENCRYPTION_KEY: ${FIO_TOKEN_ENCRYPTION_KEY:?FIO_TOKEN_ENCRYPTION_KEY must be set}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Klubio <demo@example.invalid>}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  fio-worker:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    command: ["npm", "run", "fio:worker"]
    environment:
      NODE_ENV: production
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB must be set}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      FIO_TOKEN_ENCRYPTION_KEY: ${FIO_TOKEN_ENCRYPTION_KEY:?FIO_TOKEN_ENCRYPTION_KEY must be set}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Klubio <demo@example.invalid>}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL must be set}
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
